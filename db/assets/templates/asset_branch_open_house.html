<!-- Asset: Branch Open House (print flyer, 8.5x11 at 96dpi = 816x1056) -->
<div class="asset" style="width:816px;height:1056px;position:relative;font-family:Georgia,serif;background:#fff;color:#222;">
  <div style="position:absolute;top:0;left:0;right:0;height:180px;background:#0B3D91;"></div>
  <div class="logo-area" style="position:absolute;top:40px;left:48px;width:200px;height:200px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.2);">
    {logo}
  </div>
  <h1 style="position:absolute;top:290px;left:48px;margin:0;font-size:56px;width:720px;">You're invited to our Open House</h1>
  <p style="position:absolute;top:430px;left:48px;margin:0;font-size:28px;width:720px;line-height:1.4;">Stop by {location_name} on {event_date} for refreshments, giveaways, and a chat with {manager_name} about your financial goals.</p>
  <p style="position:absolute;top:640px;left:48px;margin:0;font-size:30px;width:720px;color:#B5451B;"><strong>{deal}</strong></p>
  <div style="position:absolute;bottom:60px;left:48px;font-size:20px;line-height:1.5;">
    {address}<br>{phone}
  </div>
  <div style="position:absolute;bottom:60px;right:48px;font-size:14px;color:#777;width:300px;text-align:right;">{disclaimer}</div>
</div>
