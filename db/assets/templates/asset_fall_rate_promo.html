<!-- Asset: Fall Rate Promo (web banner, 1200x628) -->
<div class="asset" style="width:1200px;height:628px;position:relative;font-family:Arial,Helvetica,sans-serif;background:#F6F4EF;color:#0B3D91;overflow:hidden;">
  <div class="logo-area" style="position:absolute;top:40px;left:40px;width:360px;height:120px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px dashed #bbb;">
    {logo}
  </div>
  <h1 style="position:absolute;top:200px;left:40px;margin:0;font-size:64px;line-height:1.05;width:760px;">Fall into a better rate.</h1>
  <p style="position:absolute;top:360px;left:40px;margin:0;font-size:36px;width:760px;">{deal}</p>
  <div style="position:absolute;bottom:40px;left:40px;font-size:22px;line-height:1.4;">
    <strong>{location_name}</strong><br>
    {address}<br>
    {phone}
  </div>
  <div style="position:absolute;bottom:40px;right:40px;font-size:18px;color:#555;width:340px;text-align:right;line-height:1.3;">{disclaimer}</div>
</div>
